<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>BUNBUN — 여행 통역기</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0ea5e9">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="BUNBUN">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
:root{
  --bg:#0b1220; --panel:#141f35; --panel2:#1b2942; --line:#26354f;
  --txt:#e8eefb; --dim:#93a4c2; --accent:#0ea5e9; --accent2:#22d3ee;
  --me:#0e7490; --gold:#fbbf24; --danger:#f87171;
  --safe-b: env(safe-area-inset-bottom, 0px);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--txt);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",Roboto,sans-serif;
  overscroll-behavior-y:none;
  display:flex; flex-direction:column;
}
button{font-family:inherit; color:inherit; border:none; background:none; cursor:pointer}

/* ---------- 헤더 ---------- */
header{
  padding:10px 12px calc(10px);
  background:linear-gradient(180deg,#16233c,#111b2e);
  border-bottom:1px solid var(--line);
  padding-top:calc(10px + env(safe-area-inset-top,0px));
  flex:0 0 auto;
}
.langbar{display:flex; align-items:center; gap:8px}
.langsel{
  flex:1; background:var(--panel2); border:1px solid var(--line); border-radius:12px;
  padding:10px 8px; font-size:15px; font-weight:700; text-align:center;
  appearance:none; color:var(--txt);
}
.swap{
  width:42px; height:42px; flex:0 0 42px; border-radius:50%;
  background:var(--accent); color:#04121f; font-size:19px; font-weight:900;
  display:flex; align-items:center; justify-content:center;
}
.swap:active{transform:scale(.92)}
.toprow{display:flex; align-items:center; justify-content:space-between; margin-bottom:8px}
.brand{font-size:13px; font-weight:800; letter-spacing:.3px; color:var(--dim)}
.brand b{color:var(--accent2)}
.iconbtn{font-size:18px; padding:4px 8px; border-radius:10px; background:var(--panel2); border:1px solid var(--line)}
.enginepill{font-size:11px; font-weight:700; padding:4px 9px; border-radius:99px; background:#0c2e42; color:var(--accent2); border:1px solid #17475f}

/* ---------- 탭 ---------- */
nav{display:flex; background:var(--panel); border-bottom:1px solid var(--line); flex:0 0 auto}
nav button{
  flex:1; padding:12px 4px; font-size:14px; font-weight:700; color:var(--dim);
  border-bottom:2px solid transparent;
}
nav button.on{color:var(--accent2); border-bottom-color:var(--accent2); background:#0e1a2e}

/* ---------- 화면 ---------- */
main{flex:1 1 auto; overflow-y:auto; -webkit-overflow-scrolling:touch}
.view{display:none; padding:12px 12px 20px}
.view.on{display:block}

/* ---------- 대화 ---------- */
.empty{text-align:center; color:var(--dim); padding:48px 20px; font-size:14px; line-height:1.8}
.empty .big{font-size:40px; display:block; margin-bottom:12px}
.msg{margin-bottom:14px; display:flex; flex-direction:column; max-width:88%}
.msg.mine{margin-left:auto; align-items:flex-end}
.bubble{
  background:var(--panel); border:1px solid var(--line); border-radius:16px;
  padding:11px 13px; line-height:1.5;
}
.msg.mine .bubble{background:linear-gradient(180deg,#0f5f7d,#0b4d68); border-color:#12708f}
.src{font-size:13px; color:var(--dim); margin-bottom:6px; word-break:break-word}
.msg.mine .src{color:#bfe9f7}
.out{font-size:19px; font-weight:700; line-height:1.45; word-break:break-word}
.read{font-size:13px; color:var(--accent2); margin-top:5px}
.msg.mine .read{color:#a5f3fc}
.acts{display:flex; gap:6px; margin-top:8px}
.act{font-size:12px; padding:5px 10px; border-radius:9px; background:#0d1930; border:1px solid var(--line); color:var(--dim)}
.act.fav.on{color:var(--gold); border-color:#5b4715}
.tag{font-size:10px; font-weight:800; color:var(--dim); margin-bottom:4px; letter-spacing:.4px}

/* ---------- 하단 마이크 바 ---------- */
.dock{
  flex:0 0 auto; border-top:1px solid var(--line); background:#101a2c;
  padding:10px 12px calc(10px + var(--safe-b));
}
.mics{display:flex; gap:10px}
.mic{
  flex:1; border-radius:16px; padding:14px 8px; font-weight:800; font-size:15px;
  background:var(--panel2); border:1px solid var(--line);
  display:flex; flex-direction:column; align-items:center; gap:5px;
}
.mic .ic{font-size:24px}
.mic .sub{font-size:11px; font-weight:600; color:var(--dim)}
.mic.me{background:linear-gradient(180deg,#0e7490,#0b5a72); border-color:#1195b8}
.mic.me .sub{color:#c8eefb}
.mic:active{transform:scale(.97)}
.mic.rec{animation:pulse 1.1s infinite; background:linear-gradient(180deg,#b91c1c,#7f1d1d); border-color:#ef4444}
.mic.rec .sub{color:#fecaca}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.62}}
.typerow{display:flex; gap:8px; margin-top:9px}
.typerow input{
  flex:1; background:var(--panel2); border:1px solid var(--line); border-radius:12px;
  padding:11px 12px; font-size:15px; color:var(--txt); min-width:0;
}
.typerow input::placeholder{color:#64769a}
.typerow button{
  padding:0 16px; border-radius:12px; background:var(--accent); color:#04121f; font-weight:800; font-size:14px;
}
.status{font-size:12px; color:var(--dim); text-align:center; margin-top:8px; min-height:16px}
.status.err{color:var(--danger)}

/* ---------- 문장집 ---------- */
.cats{display:flex; gap:7px; overflow-x:auto; padding-bottom:10px; margin:-2px -12px 8px; padding-left:12px; padding-right:12px}
.cats::-webkit-scrollbar{display:none}
.cat{
  flex:0 0 auto; padding:8px 14px; border-radius:99px; font-size:13px; font-weight:700;
  background:var(--panel2); border:1px solid var(--line); color:var(--dim); white-space:nowrap;
}
.cat.on{background:var(--accent); color:#04121f; border-color:var(--accent)}
.p{
  background:var(--panel); border:1px solid var(--line); border-radius:14px;
  padding:12px 13px; margin-bottom:9px;
}
.p .pko{font-size:14px; color:var(--dim); margin-bottom:5px}
.p .pt{font-size:18px; font-weight:700; line-height:1.4}
.p .pr{font-size:13px; color:var(--accent2); margin-top:4px}
.p .prow{display:flex; align-items:center; gap:10px}
.p .prow .txt{flex:1; min-width:0}
.spk{
  flex:0 0 44px; width:44px; height:44px; border-radius:12px; font-size:19px;
  background:#0c2e42; border:1px solid #17475f; display:flex; align-items:center; justify-content:center;
}
.spk:active{transform:scale(.92)}

/* ---------- 기록 ---------- */
.hfilter{display:flex; gap:7px; margin-bottom:10px}
.hfilter button{
  flex:1; padding:9px; border-radius:11px; font-size:13px; font-weight:700;
  background:var(--panel2); border:1px solid var(--line); color:var(--dim);
}
.hfilter button.on{background:var(--accent); color:#04121f; border-color:var(--accent)}
.h{background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:12px 13px; margin-bottom:9px}
.h .hmeta{font-size:11px; color:var(--dim); margin-bottom:6px; display:flex; justify-content:space-between}

/* ---------- 설정 ---------- */
.sheet{
  position:fixed; inset:0; background:rgba(3,8,18,.72); display:none;
  align-items:flex-end; z-index:50;
}
.sheet.on{display:flex}
.sheetbox{
  width:100%; max-height:88vh; overflow-y:auto; background:var(--panel);
  border-radius:20px 20px 0 0; border-top:1px solid var(--line);
  padding:18px 16px calc(20px + var(--safe-b));
}
.sheetbox h3{margin:0 0 14px; font-size:17px}
.f{margin-bottom:16px}
.f label{display:block; font-size:13px; font-weight:700; color:var(--dim); margin-bottom:7px}
.f input,.f select{
  width:100%; background:var(--panel2); border:1px solid var(--line); border-radius:11px;
  padding:11px 12px; font-size:15px; color:var(--txt);
}
.f .hint{font-size:11.5px; color:var(--dim); margin-top:6px; line-height:1.6}
.rowbtn{display:flex; gap:8px}
.rowbtn button{flex:1; padding:13px; border-radius:12px; font-weight:800; font-size:15px}
.btn-p{background:var(--accent); color:#04121f}
.btn-s{background:var(--panel2); border:1px solid var(--line); color:var(--txt)}
.btn-d{background:#3b1414; border:1px solid #7f1d1d; color:#fca5a5; font-size:13px; padding:10px; width:100%; border-radius:11px; font-weight:700}
.seg{display:flex; gap:7px}
.seg button{
  flex:1; padding:11px; border-radius:11px; font-size:13.5px; font-weight:700;
  background:var(--panel2); border:1px solid var(--line); color:var(--dim);
}
.seg button.on{background:var(--accent); color:#04121f; border-color:var(--accent)}
.sw{display:flex; align-items:center; justify-content:space-between; padding:11px 0; border-bottom:1px solid var(--line)}
.sw span{font-size:14px}
.toggle{width:48px; height:28px; border-radius:99px; background:#33415c; position:relative; flex:0 0 48px}
.toggle.on{background:var(--accent)}
.toggle i{position:absolute; top:3px; left:3px; width:22px; height:22px; border-radius:50%; background:#fff; transition:.18s}
.toggle.on i{left:23px}
.toast{
  position:fixed; left:50%; transform:translateX(-50%); bottom:calc(90px + var(--safe-b));
  background:#0d2438; border:1px solid #1c4a66; color:var(--accent2);
  padding:10px 16px; border-radius:99px; font-size:13px; font-weight:700; z-index:60;
  opacity:0; pointer-events:none; transition:opacity .2s;
}
.toast.on{opacity:1}
</style>
</head>
<body>

<header>
  <div class="toprow">
    <div class="brand">🌏 여행 <b>통역기</b></div>
    <div style="display:flex; align-items:center; gap:8px">
      <span class="enginepill" id="enginePill">OpenAI 서버</span>
      <button class="iconbtn" id="btnSettings">⚙️</button>
    </div>
  </div>
  <div class="langbar">
    <select class="langsel" id="selTheirs"></select>
    <button class="swap" id="btnSwap">⇄</button>
    <select class="langsel" id="selMine"></select>
  </div>
</header>

<nav>
  <button class="on" data-view="talk">💬 대화</button>
  <button data-view="book">📖 문장집</button>
  <button data-view="hist">🕘 기록</button>
</nav>

<main>
  <section class="view on" id="view-talk">
    <div id="chat"></div>
  </section>

  <section class="view" id="view-book">
    <div class="cats" id="cats"></div>
    <div id="phrases"></div>
  </section>

  <section class="view" id="view-hist">
    <div class="hfilter">
      <button class="on" data-f="all">전체</button>
      <button data-f="fav">⭐ 즐겨찾기</button>
    </div>
    <div id="hist"></div>
  </section>
</main>

<div class="dock" id="dock">
  <div class="mics">
    <button class="mic" id="micTheirs">
      <span class="ic">🎤</span>
      <span id="micTheirsName">Tiếng Việt</span>
      <span class="sub">상대방이 말하기</span>
    </button>
    <button class="mic me" id="micMine">
      <span class="ic">🎤</span>
      <span id="micMineName">한국어</span>
      <span class="sub">내가 말하기</span>
    </button>
  </div>
  <div class="typerow">
    <input id="typed" placeholder="직접 입력해서 번역…" enterkeyhint="send">
    <button id="btnSend">번역</button>
  </div>
  <div class="status" id="status"></div>
</div>

<div class="sheet" id="sheet">
  <div class="sheetbox">
    <h3>⚙️ 설정</h3>

    <div class="f">
      <label>번역 엔진</label>
      <div class="seg" id="segEngine">
        <button data-e="server" class="on">OpenAI 서버</button>
        <button data-e="free">무료</button>
      </div>
      <div class="hint" id="engineHint"></div>
    </div>

    <div class="f" id="fCode" style="display:none">
      <label>접속 코드 <span style="font-weight:400;color:var(--muted)">(서버에 설정한 경우만)</span></label>
      <input id="accessCode" type="text" placeholder="설정하지 않았다면 비워두세요"
             autocomplete="off" autocapitalize="off" spellcheck="false">
      <div class="hint">OpenAI API 키는 Vercel 서버에만 저장됩니다. 이 기기에는 API 키를 입력하거나 저장하지 않습니다.</div>
    </div>

    <div class="f">
      <label>음성 읽기 속도 — <span id="rateVal">1.0</span>배</label>
      <input id="rate" type="range" min="0.6" max="1.3" step="0.1" value="1">
    </div>

    <div class="sw">
      <span>번역 후 자동으로 읽어주기</span>
      <div class="toggle on" id="tgAuto"><i></i></div>
    </div>
    <div class="sw" style="border-bottom:none; margin-bottom:14px">
      <span>베트남어·일본어에 한글 발음 표시</span>
      <div class="toggle on" id="tgRead"><i></i></div>
    </div>

    <div class="rowbtn" style="margin-bottom:12px">
      <button class="btn-p" id="btnClose">닫기</button>
    </div>
    <button class="btn-d" id="btnReset">번역 기록 전체 삭제</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* =========================================================
   여행 통역기 — 한국어 ↔ 베트남어 / 영어 / 일본어
   단일 파일 PWA. 외부 라이브러리 없음.
   ========================================================= */

/* ---------- 저장소 (사파리 프라이빗 모드 등에서 실패해도 앱은 동작) ---------- */
const mem = {};
const store = {
  get(k, d) {
    try { const v = localStorage.getItem(k); return v === null ? (k in mem ? mem[k] : d) : JSON.parse(v); }
    catch (e) { return k in mem ? mem[k] : d; }
  },
  set(k, v) {
    mem[k] = v;
    try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {}
  }
};

/* ---------- 언어 ---------- */
const LANGS = {
  ko: { name: '한국어',      bcp: 'ko-KR', flag: '🇰🇷' },
  vi: { name: 'Tiếng Việt', bcp: 'vi-VN', flag: '🇻🇳' },
  en: { name: 'English',    bcp: 'en-US', flag: '🇺🇸' },
  ja: { name: '日本語',      bcp: 'ja-JP', flag: '🇯🇵' }
};

/* 공용 서버(프록시) 주소 — 안드로이드 앱에서도 불러야 하므로 절대 주소로 둔다 */
const SERVER = '/api/translate';

/* 기존 버전에서 기기에 저장했던 OpenAI 키는 더 이상 사용하지 않으므로 제거한다.
   첫 업데이트 1회는 OpenAI 서버 엔진으로 자동 전환하고, 이후 사용자가 무료 엔진을
   선택하면 그 선택은 그대로 유지한다. */
try { localStorage.removeItem('key'); } catch (e) {}
const firstServerUpgrade = !store.get('serverOpenAIv1', false);
if (firstServerUpgrade) {
  store.set('engine', 'server');
  store.set('serverOpenAIv1', true);
}

const S = {
  mine:   store.get('mine', 'ko'),
  theirs: store.get('theirs', 'vi'),
  engine: (function () { const e = store.get('engine', 'server'); return e === 'free' ? 'free' : 'server'; })(),
  code:   store.get('code', ''),
  rate:   store.get('rate', 1),
  auto:   store.get('auto', true),
  showRead: store.get('showRead', true),
  hist:   store.get('hist', []),
  cat:    0,
  histFilter: 'all'
};

/* ---------- 문장집 (오프라인 동작 — 네트워크 없이도 열림) ---------- */
const BOOK = [
  { c: '인사 · 기본', items: [
    { ko:'안녕하세요',            vi:'Xin chào',                     r:'씬 짜오',            en:'Hello' , ja:'こんにちは', jr:'콘니치와'},
    { ko:'감사합니다',            vi:'Cảm ơn',                       r:'깜 언',              en:'Thank you' , ja:'ありがとうございます', jr:'아리가토오 고자이마스'},
    { ko:'죄송합니다 / 실례합니다', vi:'Xin lỗi',                      r:'씬 로이',            en:'Sorry / Excuse me' , ja:'すみません', jr:'스미마센'},
    { ko:'네',                    vi:'Vâng',                         r:'벙',                 en:'Yes' , ja:'はい', jr:'하이'},
    { ko:'아니요',                vi:'Không',                        r:'콤',                 en:'No' , ja:'いいえ', jr:'이이에'},
    { ko:'괜찮아요',              vi:'Không sao',                    r:'콤 사오',            en:"It's okay" , ja:'大丈夫です', jr:'다이조오부데스'},
    { ko:'안녕히 가세요',         vi:'Tạm biệt',                     r:'땀 비엣',            en:'Goodbye' , ja:'さようなら', jr:'사요오나라'},
    { ko:'베트남어를 못해요',      vi:'Tôi không biết tiếng Việt',    r:'또이 콤 비엣 띠엥 비엣', en:"I don't speak Vietnamese" , ja:'日本語が話せません', jr:'니혼고가 하나세마센'},
    { ko:'영어 하실 수 있어요?',   vi:'Bạn nói tiếng Anh được không?', r:'반 노이 띠엥 아인 드억 콤', en:'Do you speak English?' , ja:'英語は話せますか？', jr:'에이고와 하나세마스카'},
    { ko:'천천히 말해 주세요',     vi:'Nói chậm lại',                 r:'노이 쩜 라이',       en:'Please speak slowly' , ja:'ゆっくり話してください', jr:'윳쿠리 하나시테 쿠다사이'},
    { ko:'다시 한번 말해 주세요',  vi:'Nhắc lại giúp tôi',            r:'냑 라이 줍 또이',    en:'Could you say that again?' , ja:'もう一度言ってください', jr:'모오 이치도 잇테 쿠다사이'}
  ]},
  { c: '식당 · 카페', items: [
    { ko:'메뉴판 주세요',         vi:'Cho tôi xem thực đơn',         r:'쪼 또이 쌤 특 던',   en:'Menu, please' , ja:'メニューをお願いします', jr:'메뉴우오 오네가이시마스'},
    { ko:'이거 주세요',           vi:'Cho tôi cái này',              r:'쪼 또이 까이 나이',  en:"I'll have this" , ja:'これをお願いします', jr:'코레오 오네가이시마스'},
    { ko:'추천해 주세요',         vi:'Bạn giới thiệu món nào ngon?', r:'반 저이 티에우 몬 나오 응온', en:'What do you recommend?' , ja:'おすすめは何ですか？', jr:'오스스메와 난데스카'},
    { ko:'맵지 않게 해주세요',    vi:'Đừng cay',                     r:'등 까이',            en:'Not spicy, please' , ja:'辛くしないでください', jr:'카라쿠 시나이데 쿠다사이'},
    { ko:'고수 빼주세요',         vi:'Không rau mùi (không ngò)',    r:'콤 자우 무이 / 콤 응오', en:'No cilantro, please' , ja:'パクチーを抜いてください', jr:'파쿠치오 누이테 쿠다사이'},
    { ko:'얼음 빼주세요',         vi:'Không đá',                     r:'콤 다',              en:'No ice, please' , ja:'氷なしでお願いします', jr:'코오리 나시데 오네가이시마스'},

  if (selMine.value === selTheirs.value) {

    selTheirs.value = Object.keys(LANGS).find((k) => k !== selMine.value);

  $('micMineName').textContent = LANGS[S.mine].name;
  $('micTheirsName').textContent = LANGS[S.theirs].name;

}

/* =========================================================
   번역 엔진
   ========================================================= */
async function translate(text, from, to) {
  if (S.engine === 'server') {
    try {
      return await translateServer(text, from, to);
    } catch (e) {
      // 구버전 서버가 아직 일본어를 모르면 일본어 쌍만 무료 엔진으로 자동 우회한다.
      if (from === 'ja' || to === 'ja') return translateFree(text, from, to);
      throw e;
    }
  }
  return translateFree(text, from, to);
}

/* --- 공용 서버: OpenAI 키는 서버에만 있고, 여기선 초대코드만 보낸다 --- */
async function translateServer(text, from, to) {
  let res;
  try {
    res = await fetch(SERVER, {
      method: 'POST',
      headers: Object.assign({ 'Content-Type': 'application/json' }, S.code ? { 'X-Access-Code': S.code } : {}),
      body: JSON.stringify({ text: text, from: from, to: to })
    });
  } catch (e) {
    throw new Error('공용 서버에 연결하지 못했어요. 인터넷 연결을 확인해 주세요');
  }

  let j = {};
  try { j = await res.json(); } catch (e) {}

  if (!res.ok) throw new Error(j.error || ('공용 서버 오류 (' + res.status + ')'));
  if (!j.translation) throw new Error('번역 결과를 받지 못했어요');

  return { text: j.translation, read: (to === 'vi' || to === 'ja') ? (j.reading || '') : '' };
}

/* ---------------------------------------------------------
   결과 언어 검증
   MyMemory 같은 공개 번역 메모리는 한국어를 요청해도 엉뚱하게
   중국어/일본어 문장을 돌려주는 경우가 있음. 목표 언어의 문자
   체계와 맞지 않으면 그 결과는 버리고 다음 엔진으로 넘어간다.
   --------------------------------------------------------- */
const RE_HANGUL = /[가-힣ᄀ-ᇿ㄰-㆏]/;
const RE_HAN    = /[一-鿿㐀-䶿豈-﫿]/;   // 한자
const RE_KANA   = /[぀-ゟ゠-ヿ]/;                // 히라가나/가타카나
const RE_LETTER = /[A-Za-zÀ-ɏḀ-ỿ가-힣一-鿿぀-ヿ]/;

function looksLike(s, lang) {
  const t = String(s || '').trim();
  if (!t) return false;
  if (!RE_LETTER.test(t)) return true;          // 숫자·기호만 → 그대로 통과
  if (lang === 'ko') return RE_HANGUL.test(t) && !RE_KANA.test(t);
  if (lang === 'ja') return (RE_KANA.test(t) || RE_HAN.test(t)) && !RE_HANGUL.test(t);
  if (lang === 'vi' || lang === 'en') return !RE_HAN.test(t) && !RE_KANA.test(t) && !RE_HANGUL.test(t);
  return true;
}

/* --- 무료 엔진 1: 구글 번역 공개 엔드포인트 (키 불필요) --- */
async function engineGoogle(text, from, to) {
  const url = 'https://translate.googleapis.com/translate_a/single?client=gtx' +
              '&sl=' + from + '&tl=' + to + '&dt=t&q=' + encodeURIComponent(text);
  const res = await fetch(url);
  if (!res.ok) throw new Error('google ' + res.status);
  const j = await res.json();
  return (j[0] || []).map((seg) => seg[0]).join('');
}

/* --- 무료 엔진 2: MyMemory (지역 코드까지 붙여야 오번역이 줄어듦) --- */
const MM_LOCALE = { ko: 'ko-KR', vi: 'vi-VN', en: 'en-US', ja: 'ja-JP' };
async function engineMyMemory(text, from, to) {
  const url = 'https://api.mymemory.translated.net/get?q=' +
              encodeURIComponent(text.slice(0, 480)) +
              '&langpair=' + MM_LOCALE[from] + '|' + MM_LOCALE[to] + '&mt=1';
  const res = await fetch(url);
  if (!res.ok) throw new Error('mymemory ' + res.status);
  const j = await res.json();
  const out = j && j.responseData && j.responseData.translatedText;
  if (!out) throw new Error('mymemory empty');
  if (/MYMEMORY WARNING|QUOTA/i.test(out)) throw new Error('QUOTA');
  return decodeHtml(out);
}

/* --- 무료 번역: 엔진을 순서대로 시도하고, 언어가 안 맞으면 다음으로 --- */
const FREE_ENGINES = [engineGoogle, engineMyMemory];

async function translateFree(text, from, to) {
  let quota = false, got = null;

  for (const engine of FREE_ENGINES) {
    try {
      const out = (await engine(text, from, to) || '').trim();
      if (!out) continue;
      if (looksLike(out, to)) return { text: out, read: '' };
      got = out;                                 // 언어가 안 맞음 → 다음 엔진 시도
    } catch (e) {
      if (String(e.message) === 'QUOTA') quota = true;
    }
  }

  if (quota) throw new Error('무료 번역 하루 사용량을 초과했어요. 설정에서 OpenAI로 바꿔보세요');
  if (got) throw new Error('번역기가 ' + LANGS[to].name + '가 아닌 엉뚱한 언어를 돌려줬어요. 다시 시도하거나 OpenAI로 바꿔보세요');
  throw new Error('번역 서버에 연결하지 못했어요. 인터넷 연결을 확인해 주세요');
}

function decodeHtml(s) {
  const d = document.createElement('textarea'); d.innerHTML = s; return d.value;
}

/* =========================================================
   안드로이드 앱(WebView)에서 실행 중인지 판별
   안드로이드 WebView 에는 브라우저 음성 API가 없어서, 앱으로 감쌀 때는
   안드로이드 자체 음성 엔진을 AndroidBridge 로 넘겨받아 쓴다.
   브라우저에서는 AndroidBridge 가 없으므로 NATIVE = false 가 되고
   기존 Web Speech API 경로가 그대로 동작한다.
   ========================================================= */
const NATIVE = (function () {
  try { return !!(window.AndroidBridge && window.AndroidBridge.available()); }
  catch (e) { return false; }
})();

/* =========================================================
   음성 출력 (TTS)
   ========================================================= */
let voices = [];
function loadVoices() { voices = window.speechSynthesis ? speechSynthesis.getVoices() : []; }
if (window.speechSynthesis) {
  loadVoices();
  speechSynthesis.onvoiceschanged = loadVoices;
}
function speak(text, lang) {
  if (!text) return;
  if (NATIVE) {                                   // 안드로이드 TextToSpeech
    try { AndroidBridge.speak(text, lang, S.rate); } catch (e) {}
    return;
  }
  if (!window.speechSynthesis) return;
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    const bcp = LANGS[lang].bcp;
    u.lang = bcp;
    u.rate = S.rate;
    const v = voices.find((x) => x.lang === bcp) ||
              voices.find((x) => x.lang && x.lang.replace('_', '-').startsWith(lang));
    if (v) u.voice = v;
    speechSynthesis.speak(u);
  } catch (e) {}
}

/* =========================================================
   음성 인식 (STT)
   ========================================================= */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null, recBtn = null;

/* --- 안드로이드 앱: 네이티브 SpeechRecognizer 사용 --- */
let nBtn = null, nLang = null, nOn = false;

function listenNative(lang, btn) {
  if (nOn) { try { AndroidBridge.stopListening(); } catch (e) {} return; }
  nOn = true; nBtn = btn; nLang = lang;
  btn.classList.add('rec');
  setStatus('🎙️ ' + LANGS[lang].name + '로 말하세요…');
  try {
    AndroidBridge.startListening(lang);
  } catch (e) {
    endNative();
    setStatus('음성 인식을 시작하지 못했어요', true);
  }
}

function endNative() {
  nOn = false;
  if (nBtn) nBtn.classList.remove('rec');
  nBtn = null;
}

/* 안드로이드에서 호출하는 콜백 */
window.__native = function (raw) {
  let m;
  try { m = JSON.parse(raw); } catch (e) { return; }

  if (m.type === 'stt-partial') {
    setStatus('🎙️ ' + m.data);

  } else if (m.type === 'stt-result') {
    const lang = nLang;
    setStatus('');
    if (m.data) go(m.data, lang);

  } else if (m.type === 'stt-end') {
    endNative();

  } else if (m.type === 'stt-error') {
    endNative();
    setStatus(STT_MSG[m.data] || ('음성 인식 오류: ' + m.data), true);

  } else if (m.type === 'tts-missing') {
    const name = LANGS[m.data] ? LANGS[m.data].name : m.data;
    setStatus(name + ' 음성 데이터가 없어요. 설정 > 언어 및 입력 > 텍스트 음성 변환에서 내려받아 주세요', true);

  } else if (m.type === 'tts-error') {
    setStatus('음성 출력을 쓸 수 없어요', true);
  }
};

function listen(lang, btn) {
  if (NATIVE) return listenNative(lang, btn);
  if (!SR) {
    setStatus('이 브라우저는 음성 인식을 지원하지 않아요. 안드로이드 크롬을 써주세요', true);
    return;
  }
  if (rec) { try { rec.stop(); } catch (e) {} return; }

  rec = new SR();
  rec.lang = LANGS[lang].bcp;
  rec.interimResults = true;
  rec.maxAlternatives = 1;
  rec.continuous = false;

  recBtn = btn; btn.classList.add('rec');
  setStatus('🎙️ ' + LANGS[lang].name + '로 말하세요…');

  let finalText = '';
  rec.onresult = (e) => {
    let interim = '';
    for (let i = e.resultIndex; i < e.results.length; i++) {
      const t = e.results[i][0].transcript;
      if (e.results[i].isFinal) finalText += t; else interim += t;
    }
    setStatus('🎙️ ' + (finalText || interim));
  };
  rec.onerror = (e) => {
    const map = {
      'not-allowed': '마이크 권한이 차단돼 있어요. 브라우저 주소창의 자물쇠에서 마이크를 허용해 주세요',
      'no-speech': '소리를 못 들었어요. 다시 눌러서 말해주세요',
      'network': '음성 인식은 인터넷 연결이 필요해요',
      'audio-capture': '마이크를 찾지 못했어요'
    };
    setStatus(map[e.error] || ('음성 인식 오류: ' + e.error), true);
  };
  rec.onend = () => {
    btn.classList.remove('rec'); rec = null; recBtn = null;
    const t = finalText.trim();
    if (t) { setStatus(''); go(t, lang); }
  };

  try { rec.start(); } catch (e) { btn.classList.remove('rec'); rec = null; }
}

$('micMine').onclick   = () => listen(S.mine,   $('micMine'));
$('micTheirs').onclick = () => listen(S.theirs, $('micTheirs'));

/* =========================================================
   대화 흐름
   ========================================================= */
async function go(text, fromLang) {
  const to = fromLang === S.mine ? S.theirs : S.mine;
  const mine = fromLang === S.mine;
  const el = addBubble({ src: text, out: '번역 중…', read: '', mine, from: fromLang, to, pending: true });
  setStatus('');
  try {
    const r = await translate(text, fromLang, to);
    // 기록에 먼저 넣어야 말풍선의 ☆저장 버튼이 해당 기록을 찾을 수 있음
    S.hist.unshift({ src: text, out: r.text, read: r.read, from: fromLang, to, t: Date.now(), fav: false });
    if (S.hist.length > 300) S.hist.length = 300;
    store.set('hist', S.hist);
    updateBubble(el, { src: text, out: r.text, read: r.read, mine, from: fromLang, to });
    if (S.auto) speak(r.text, to);
  } catch (err) {
    updateBubble(el, { src: text, out: '⚠️ ' + err.message, read: '', mine, from: fromLang, to, error: true });
    setStatus(err.message, true);
  }
}

function bubbleHTML(d) {
  const showRead = S.showRead && d.read && (d.to === 'vi' || d.to === 'ja');
  return (
    '<div class="tag">' + LANGS[d.from].flag + ' → ' + LANGS[d.to].flag + ' ' + LANGS[d.to].name + '</div>' +
    '<div class="bubble">' +
      '<div class="src">' + esc(d.src) + '</div>' +
      '<div class="out">' + esc(d.out) + '</div>' +
      (showRead ? '<div class="read">🔊 ' + esc(d.read) + '</div>' : '') +
      (d.pending || d.error ? '' :
        '<div class="acts">' +
          '<button class="act" data-a="speak">🔊 듣기</button>' +
          '<button class="act" data-a="copy">📋 복사</button>' +
          '<button class="act fav" data-a="fav">☆ 저장</button>' +
        '</div>') +
    '</div>'
  );
}

function addBubble(d) {
  if (!chat.querySelector('.msg')) chat.innerHTML = '';
  const el = document.createElement('div');
  el.className = 'msg' + (d.mine ? ' mine' : '');
  el.innerHTML = bubbleHTML(d);
  chat.appendChild(el);
  document.querySelector('main').scrollTop = document.querySelector('main').scrollHeight;
  return el;
}

function updateBubble(el, d) {
  el.innerHTML = bubbleHTML(d);
  el.querySelectorAll('.act').forEach((b) => {
    b.onclick = () => {
      const a = b.dataset.a;
      if (a === 'speak') speak(d.out, d.to);
      if (a === 'copy') { copy(d.out); toast('복사했어요'); }
      if (a === 'fav') {
        const h = S.hist.find((x) => x.src === d.src && x.out === d.out);
        if (h) { h.fav = !h.fav; store.set('hist', S.hist);
          b.classList.toggle('on', h.fav); b.textContent = h.fav ? '★ 저장됨' : '☆ 저장';
          toast(h.fav ? '즐겨찾기에 저장했어요' : '즐겨찾기에서 뺐어요'); }
      }
    };
  });
  document.querySelector('main').scrollTop = document.querySelector('main').scrollHeight;
}

function esc(s) {
  return String(s).replace(/[&<>"]/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));
}
function copy(t) {
  try { navigator.clipboard.writeText(t); }
  catch (e) {
    const a = document.createElement('textarea'); a.value = t;
    document.body.appendChild(a); a.select(); document.execCommand('copy'); a.remove();
  }
}

/* 직접 입력 */
function sendTyped() {
  const v = $('typed').value.trim();
  if (!v) return;
  $('typed').value = '';
  go(v, S.mine);
}
$('btnSend').onclick = sendTyped;
$('typed').addEventListener('keydown', (e) => { if (e.key === 'Enter') sendTyped(); });

function emptyChat() {
  chat.innerHTML =
    '<div class="empty"><span class="big">🎤</span>' +
    '아래 마이크를 누르고 말해보세요.<br>' +
    '왼쪽은 <b>상대방</b>, 오른쪽은 <b>나</b>예요.<br><br>' +
    '인터넷이 없을 땐 위 <b>📖 문장집</b> 탭을 쓰세요.</div>';
}

/* =========================================================
   문장집
   ========================================================= */
function renderCats() {
  $('cats').innerHTML = BOOK.map((b, i) =>
    `<button class="cat${i === S.cat ? ' on' : ''}" data-i="${i}">${b.c}</button>`).join('');
  $('cats').querySelectorAll('.cat').forEach((b) => {
    b.onclick = () => { S.cat = +b.dataset.i; renderCats(); renderBook(); };
  });
}

function renderBook() {
  const target = S.theirs === 'ko' ? S.mine : S.theirs;   // 보여줄 상대 언어
  const list = BOOK[S.cat].items;
  $('phrases').innerHTML = list.map((p, i) => {
    const t = p[target] || p.en || p.vi || p.ko;
    const read = target === 'vi' ? p.r : (target === 'ja' ? p.jr : '');
    const r = (read && S.showRead) ? `<div class="pr">🔊 ${esc(read)}</div>` : '';
    const koLabel = (target === 'ja' && p.ko === '베트남어를 못해요') ? '일본어를 못해요' : p.ko;
    return (
      '<div class="p"><div class="prow"><div class="txt">' +
        '<div class="pko">' + esc(koLabel) + '</div>' +
        '<div class="pt">' + esc(t) + '</div>' + r +
      '</div><button class="spk" data-i="' + i + '">🔊</button></div></div>'
    );
  }).join('');
  $('phrases').querySelectorAll('.spk').forEach((b) => {
    b.onclick = () => {
      const p = list[+b.dataset.i];
      speak(p[target] || p.en || p.vi || p.ko, target);
    };
  });
}

/* =========================================================
   기록
   ========================================================= */
function renderHist() {
  const rows = S.histFilter === 'fav' ? S.hist.filter((h) => h.fav) : S.hist;
  if (!rows.length) {
    $('hist').innerHTML = '<div class="empty"><span class="big">🕘</span>' +
      (S.histFilter === 'fav' ? '저장한 문장이 아직 없어요.' : '번역 기록이 아직 없어요.') + '</div>';
    return;
  }
  $('hist').innerHTML = rows.map((h, i) => {
    const showRead = S.showRead && h.read && (h.to === 'vi' || h.to === 'ja');
    return (
      '<div class="h">' +
        '<div class="hmeta"><span>' + LANGS[h.from].flag + ' → ' + LANGS[h.to].flag + '</span>' +
        '<span>' + fmt(h.t) + '</span></div>' +
        '<div class="src">' + esc(h.src) + '</div>' +
        '<div class="out">' + esc(h.out) + '</div>' +
        (showRead ? '<div class="read">🔊 ' + esc(h.read) + '</div>' : '') +
        '<div class="acts">' +
          '<button class="act" data-a="speak" data-i="' + i + '">🔊 듣기</button>' +
          '<button class="act" data-a="copy" data-i="' + i + '">📋 복사</button>' +
          '<button class="act fav' + (h.fav ? ' on' : '') + '" data-a="fav" data-i="' + i + '">' +
            (h.fav ? '★ 저장됨' : '☆ 저장') + '</button>' +
        '</div>' +
      '</div>'
    );
  }).join('');
  $('hist').querySelectorAll('.act').forEach((b) => {
    b.onclick = () => {
      const h = rows[+b.dataset.i];
      if (b.dataset.a === 'speak') speak(h.out, h.to);
      if (b.dataset.a === 'copy') { copy(h.out); toast('복사했어요'); }
      if (b.dataset.a === 'fav') { h.fav = !h.fav; store.set('hist', S.hist); renderHist(); }
    };
  });
}
function fmt(t) {
  const d = new Date(t);
  const p = (n) => String(n).padStart(2, '0');
  return `${d.getMonth() + 1}/${d.getDate()} ${p(d.getHours())}:${p(d.getMinutes())}`;
}
document.querySelectorAll('.hfilter button').forEach((b) => {
  b.onclick = () => {
    document.querySelectorAll('.hfilter button').forEach((x) => x.classList.remove('on'));
    b.classList.add('on'); S.histFilter = b.dataset.f; renderHist();
  };
});

/* =========================================================
   설정
   ========================================================= */
$('btnSettings').onclick = () => $('sheet').classList.add('on');
$('btnClose').onclick = () => $('sheet').classList.remove('on');
$('sheet').onclick = (e) => { if (e.target === $('sheet')) $('sheet').classList.remove('on'); };

const ENGINE_HINT = {
  server: 'Vercel 서버에 저장된 OpenAI API 키로 번역합니다. 각 휴대폰이나 PC에는 API 키를 넣지 않아도 됩니다. 여행 회화체와 베트남어·일본어 한글 발음을 지원합니다.',
  free:   'OpenAI 서버를 쓰지 않는 무료 번역(구글 → MyMemory)입니다. 짧은 문장은 충분하지만 구어체 뉘앙스는 약합니다.'
};

function engineActive() { return true; }

function applyEngineUI() {
  document.querySelectorAll('#segEngine button').forEach((b) =>
    b.classList.toggle('on', b.dataset.e === S.engine));

  $('fCode').style.display = S.engine === 'server' ? 'block' : 'none';
  $('engineHint').textContent = ENGINE_HINT[S.engine] || '';

  const label = { server: 'OpenAI 서버', free: '무료 번역' };
  $('enginePill').textContent = engineActive() ? label[S.engine] : '무료 번역';
}

document.querySelectorAll('#segEngine button').forEach((b) => {
  b.onclick = () => {
    S.engine = b.dataset.e; store.set('engine', S.engine); applyEngineUI();
    setStatus('');
  };
});


$('accessCode').value = S.code;
$('accessCode').oninput = () => { S.code = $('accessCode').value.trim(); store.set('code', S.code); applyEngineUI(); };

/* 링크에 ?code=... 가 들어 있으면 초대코드를 자동으로 저장하고 공용 서버로 맞춘다 */
(function adoptCodeFromUrl() {
  let c = '';
  try { c = new URLSearchParams(location.search).get('code') || ''; } catch (e) {}
  if (!c) return;
  S.code = c.trim();
  S.engine = 'server';
  store.set('code', S.code);
  store.set('engine', S.engine);
  $('accessCode').value = S.code;
  // 주소창에서 코드를 지워 화면 캡처 등으로 새어나가지 않게 한다
  try { history.replaceState(null, '', location.pathname); } catch (e) {}
})();

$('rate').value = S.rate;
$('rateVal').textContent = Number(S.rate).toFixed(1);
$('rate').oninput = () => {
  S.rate = +$('rate').value; store.set('rate', S.rate);
  $('rateVal').textContent = S.rate.toFixed(1);
};

function bindToggle(id, key, after) {
  const el = $(id);
  el.classList.toggle('on', !!S[key]);
  el.onclick = () => { S[key] = !S[key]; store.set(key === 'auto' ? 'auto' : 'showRead', S[key]);
    el.classList.toggle('on', S[key]); if (after) after(); };
}
bindToggle('tgAuto', 'auto');
bindToggle('tgRead', 'showRead', () => { renderBook(); renderHist(); });

$('btnReset').onclick = () => {
  S.hist = []; store.set('hist', []); renderHist(); emptyChat();
  toast('기록을 모두 지웠어요');
};

/* =========================================================
   서비스워커 등록 (오프라인)
   ========================================================= */
/* 안드로이드 앱은 파일이 이미 앱 안에 들어 있어서 서비스워커가 필요 없다 */
if (!NATIVE && 'serviceWorker' in navigator && location.protocol !== 'file:') {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}

/* ---------- 시작 ---------- */
initLangSelects();
applyEngineUI();
renderCats();
renderBook();
emptyChat();
renderHist();
if (!SR && !NATIVE) setStatus('이 브라우저는 음성 인식을 지원하지 않아요 — 아래 입력창으로 번역하세요');
</script>
