name: Build WIPI Emulator APK

on:
  push:
    branches:
      - build/wipi-emulator-apk-20261006
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout WIPI Emulator
        uses: actions/checkout@v4
        with:
          repository: ParkJeongseop/WIPI-Emulator
          ref: main
          path: wipi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform and NDK
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.2.12479018" >> "$GITHUB_ENV"
          echo "$ANDROID_SDK_ROOT/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin" >> "$GITHUB_PATH"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Build native emulator core
        shell: bash
        working-directory: wipi/rust
        run: |
          mkdir -p ../android/app/src/main/jniLibs
          cargo ndk -t arm64-v8a -t x86_64 -o ../android/app/src/main/jniLibs build --release -p wipi_android
          find ../android/app/src/main/jniLibs -maxdepth 2 -type f -ls

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build debug APK
        shell: bash
        working-directory: wipi/android
        run: gradle assembleDebug --stacktrace

      - name: Prepare APK
        shell: bash
        run: |
          cp wipi/android/app/build/outputs/apk/debug/app-debug.apk ./BattleMonster2-WIPI-Emulator.apk
          sha256sum BattleMonster2-WIPI-Emulator.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: BattleMonster2-WIPI-Emulator
          path: BattleMonster2-WIPI-Emulator.apk
          if-no-files-found: error
