name: Build BUNBUN APK

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'mobile/MainActivity.kt'
      - '.github/workflows/build-bunbun-apk.yml'
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout BUNBUN
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Create Android wrapper
        shell: bash
        run: |
          git clone --depth 1 https://github.com/iksanarisandi/templatehtmlview.git androidapp

          python3 - <<'PY'
          from pathlib import Path
          import re

          gradle = Path('androidapp/app/build.gradle.kts')
          s = gradle.read_text()
          s = s.replace('applicationId = "com.mycatatan.simple1"', 'applicationId = "com.bunbun.translator"')
          s = s.replace('versionCode = 1', 'versionCode = 4')
          s = s.replace('versionName = "1.0.0"', 'versionName = "1.3.0-bunbun"')
          gradle.write_text(s)

          manifest = Path('androidapp/app/src/main/AndroidManifest.xml')
          s = manifest.read_text()
          if 'android.permission.RECORD_AUDIO' not in s:
              s = s.replace(
                  '<uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />',
                  '<uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />\n    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />'
              )
          if 'android.intent.action.TTS_SERVICE' not in s:
              s = s.replace(
                  '<application',
                  '<queries>\n        <intent>\n            <action android:name="android.intent.action.TTS_SERVICE" />\n        </intent>\n    </queries>\n\n    <application',
                  1
              )
          s = s.replace('android:usesCleartextTraffic="true"', 'android:usesCleartextTraffic="false"')
          manifest.write_text(s)

          strings = Path('androidapp/app/src/main/res/values/strings.xml')
          if strings.exists():
              s = strings.read_text()
              s = re.sub(r'<string name="app_name">.*?</string>', '<string name="app_name">BUNBUN</string>', s)
              strings.write_text(s)
          PY

          cp mobile/MainActivity.kt androidapp/app/src/main/java/com/mycatatan/simple1/MainActivity.kt
          mkdir -p androidapp/app/src/main/assets
          cp index.html androidapp/app/src/main/assets/index.html

          python3 - <<'PY'
          from pathlib import Path
          p = Path('androidapp/app/src/main/assets/index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace("const SERVER = '/api/translate';", "const SERVER = 'https://bunbun-kknd1200s-projects.vercel.app/api/translate';")
          p.write_text(s, encoding='utf-8')
          if 'bunbun-kknd1200s-projects.vercel.app/api/translate' not in s:
              raise SystemExit('BUNBUN server URL patch failed')
          if "ja: { name: '日本語'" not in s:
              raise SystemExit('Japanese support missing')
          PY

      - name: Build installable APK
        shell: bash
        run: |
          cd androidapp
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../BUNBUN.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: BUNBUN-apk
          path: BUNBUN.apk
          retention-days: 7
