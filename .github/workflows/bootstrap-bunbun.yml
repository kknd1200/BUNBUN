name: Bootstrap BUNBUN source

on:
  push:
    paths:
      - '.github/workflows/bootstrap-bunbun.yml'

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rebuild source bundle
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/part00.b64 .bootstrap/part01.b64 .bootstrap/part02.b64 .bootstrap/part03.b64 | tr -d '\n\r' | base64 -d > /tmp/BUNBUN.zip
          mkdir -p /tmp/bunbun-src
          unzip -q /tmp/BUNBUN.zip -d /tmp/bunbun-src
          cp -a /tmp/bunbun-src/BUNBUN/. ./
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap-bunbun.yml

      - name: Commit BUNBUN files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Upload complete BUNBUN translator source'
          git push
